name: Kemas kini trending & deploy ke GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # setiap jam (minit ke-17)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ambil topik trending
        run: node scripts/fetch-trends.mjs site/data/trends.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LOWYAT_RSS: ${{ vars.LOWYAT_RSS }}
          ENABLE_REDDIT: ${{ vars.ENABLE_REDDIT }}
      - name: Tetapkan versi app
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$V/g" site/sw.js site/js/version.js
          MSG="$(git log -1 --pretty=%s | head -c 160)"
          node -e "require('fs').writeFileSync('site/version.json', JSON.stringify({ version: process.argv[1], built_at: new Date().toISOString(), notes: process.argv[2] }))" "$V" "$MSG"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
