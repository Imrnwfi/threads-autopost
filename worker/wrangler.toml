# Konfigurasi Cloudflare Worker "threads-autopost" (Pembaca link Shopee).
# Cloudflare → Workers & Pages → Create → Connect GitHub → repo threads-autopost → Root directory: worker
name = "threads-autopost"
main = "shopee-reader.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true

# Kemas kini berita setiap 30 minit (perlu secret GH_TOKEN)
[triggers]
crons = ["*/30 * * * *"]
